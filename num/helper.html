      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    var plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(DATA.iv) },
      key,
      b64ToBytes(DATA.ct)
    );
    return new TextDecoder().decode(plain);
  }

  function render(html) {
    // 用解密出的完整 HTML 文档替换当前页面
    document.open();
    document.write(html);
    document.close();
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var password = pwEl.value;
    if (!password) return;

    btn.disabled = true;
    say('解密中…', 'info');

    try {
      var html = await unlock(password);
      try { sessionStorage.setItem('plate_pw', password); } catch (_) {}
      render(html);
    } catch (err) {
      btn.disabled = false;
      say('密码错误，请重试', 'err');
      pwEl.value = '';
      pwEl.focus();
    }
  });

  // 本次浏览器会话内已解锁过，则自动进入
  (async function () {
    var saved = null;
    try { saved = sessionStorage.getItem('plate_pw'); } catch (_) {}
    if (!saved) return;
    try {
      render(await unlock(saved));
    } catch (_) {
      try { sessionStorage.removeItem('plate_pw'); } catch (_) {}
    }
  })();
})();
</script>
</body>
</html>
